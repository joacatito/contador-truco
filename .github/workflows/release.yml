# Builds and publishes both apps whenever main changes, which should only ever happen by
# merging a pull request. Branch protection is not enforced on private repositories on the
# free plan, so the `guard` job checks that rule itself before anything is built or published.
name: Release

on:
  push:
    branches: [main]
    # Merges that touch only these files ship nothing new to the stores, so they do not build.
    # The iOS build runs on macOS, whose minutes count 10x against the free quota.
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - 'store-assets/**'
      - '**/*.md'
      - '.github/dependabot.yml'
      - '.github/pull_request_template.md'
      - '.githooks/**'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_ID: com.joaquimtito.games.contadordetruco

jobs:
  guard:
    name: Origem e versão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Require a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty')
          if [ -z "$pr" ]; then
            echo "::error title=Push direto na main::O commit ${GITHUB_SHA} não veio de um Pull Request mesclado. Nada será publicado."
            exit 1
          fi
          echo "Commit veio do PR #$pr" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute version
        id: version
        run: |
          # Both stores reject a build number they have already seen. Minutes since 2020-01-01 UTC grow with
          # every run, start above any hand-made build, and stay far below Android's 2,100,000,000 limit.
          build_number=$(( ($(date -u +%s) - 1577836800) / 60 ))
          version_name=$(node -p "require('./package.json').version")
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "Versão **$version_name** (build **$build_number**)" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Qualidade
    needs: guard
    uses: ./.github/workflows/checks.yml

  android:
    name: Android → Google Play
    needs: [guard, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check required secrets and variables
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          .github/scripts/require-env.sh \
            --secrets ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON

      - name: Require real AdMob IDs
        run: .github/scripts/check-admob.sh android

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Give Gradle the runner's memory and cores
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.workers.max=4
          kotlin.daemon.jvmargs=-Xmx2g
          PROPS

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build signed AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ needs.guard.outputs.build_number }}
          VERSION_NAME: ${{ needs.guard.outputs.version_name }}
        run: ./gradlew app:bundleRelease --no-daemon

      - name: Keep the AAB as a pipeline artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab-${{ needs.guard.outputs.build_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_ID }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

  ios:
    name: iOS → TestFlight
    needs: [guard, checks]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # CocoaPods and xcodeproj fail to parse the project under a non-UTF-8 locale.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check required secrets and variables
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          .github/scripts/require-env.sh \
            --secrets IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 \
                      APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_PRIVATE_KEY \
            --vars IOS_TEAM_ID

      - name: Require real AdMob IDs
        run: .github/scripts/check-admob.sh ios

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Ruby (CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install pods
        working-directory: ios
        run: bundle exec pod install

      - name: Install signing certificate and provisioning profile
        id: signing
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          # Adds the new keychain to the search list; the existing entries are split into separate arguments on purpose.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          profile="$RUNNER_TEMP/app.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "profile_name=$name" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Configure signing and version on the app target
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          BUILD_NUMBER: ${{ needs.guard.outputs.build_number }}
          VERSION_NAME: ${{ needs.guard.outputs.version_name }}
        run: bundle exec ruby .github/scripts/ios-configure-release.rb

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/ContadorDeTrucoNative.xcworkspace \
            -scheme ContadorDeTrucoNative \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ContadorDeTrucoNative.xcarchive" \
            archive | tail -n 200

      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>${APP_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ContadorDeTrucoNative.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Keep the IPA as a pipeline artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-${{ needs.guard.outputs.build_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          ipa=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -n 1)
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain }}" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"
