# Reusable quality gate: called by both the PR validation and the release pipeline,
# so main is held to exactly the same checks as the pull requests that feed it.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci
