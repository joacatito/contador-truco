# Free on private repositories: opens dependency-update PRs, which go through PR Validation
# (without the Android build, to save Actions minutes). Kept to one grouped PR per ecosystem
# per month: each PR and each rebase runs the checks again against the 2,000-minute quota.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns: ['*']
    ignore:
      # React Native upgrades need native changes too; do them by hand.
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@react-native/*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@react-native-community/cli*'
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns: ['*']
